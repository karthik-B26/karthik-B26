<svg viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151f"/>
      <stop offset="100%" stop-color="#1c1d33"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="4" y="4" width="1192" height="212" rx="24"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect x="4" y="4" width="1192" height="212" rx="24" fill="url(#bgGrad)" stroke="#3b3d5c" stroke-width="2"/>

  <!-- Animated network / wave background, clipped to the rounded card -->
  <g clip-path="url(#cardClip)">

    <!-- Drifting wave line 1 -->
    <g>
      <path d="M0,150 C150,110 300,190 450,150 C600,110 750,190 900,150 C1050,110 1200,190 1350,150"
            fill="none" stroke="#7aa2f7" stroke-opacity="0.22" stroke-width="2"/>
      <path d="M-1200,150 C-1050,110 -900,190 -750,150 C-600,110 -450,190 -300,150 C-150,110 0,190 150,150"
            fill="none" stroke="#7aa2f7" stroke-opacity="0.22" stroke-width="2"/>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-1200,0" dur="22s" repeatCount="indefinite"/>
    </g>

    <!-- Drifting wave line 2 (opposite direction, different depth) -->
    <g>
      <path d="M0,80 C150,50 300,110 450,80 C600,50 750,110 900,80 C1050,50 1200,110 1350,80"
            fill="none" stroke="#7dcfff" stroke-opacity="0.16" stroke-width="1.5"/>
      <path d="M1200,80 C1350,50 1500,110 1650,80 C1800,50 1950,110 2100,80 C2250,50 2400,110 2550,80"
            fill="none" stroke="#7dcfff" stroke-opacity="0.16" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-1200,0" dur="30s" repeatCount="indefinite"/>
    </g>

    <!-- Pulsing particle dots -->
    <circle cx="90"  cy="40"  r="2" fill="#7dcfff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="170" r="1.6" fill="#7aa2f7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="55" r="2.2" fill="#bb9af7"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.5s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="185" r="1.8" fill="#7dcfff"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.5s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="35" r="2" fill="#7aa2f7"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="175" r="1.7" fill="#bb9af7"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="50" r="2.1" fill="#7dcfff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="5.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="180" r="1.6" fill="#7aa2f7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="45" r="2" fill="#bb9af7"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="110" r="1.5" fill="#7dcfff"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="5.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="120" r="1.5" fill="#7aa2f7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="115" r="1.8" fill="#bb9af7"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.9s" begin="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Heading: "Hi, I'm " + gradient name + blinking cursor.
       x positions are pre-computed (not text-anchor=middle) so the three
       differently-colored tspans line up as one centered run instead of
       each re-centering independently. -->
  <text y="100" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="46">
    <tspan x="328.5" fill="#c0caf5">Hi, I'm </tspan><tspan x="477.5" fill="url(#nameGrad)">Karthik Boppana</tspan><tspan x="845.5" fill="#7dcfff"> |<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="155" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="21" fill="#c0caf5">
    Full-Stack Web Developer 💻 &#160;|&#160; ☁️ Cloud Enthusiast &#160;|&#160; Open to Work 🚀
  </text>
</svg>
